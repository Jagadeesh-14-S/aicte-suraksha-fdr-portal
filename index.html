<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AICTE-SURAKSHA | Unified Security Deposit & FDR Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      /* Hide default Google Translate top banner while preserving translation */
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0px !important; }
      #goog-gt-tt { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="google_translate_element" class="hidden"></div>
    <div id="root"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,ta,te,kn,ml,mr,bn,gu,pa,or,ur,as,sa',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
